[project]
name = "repograte"
version = "0.1.0"
description = "An agentic pipeline that migrates code (single-file or across a whole repo) using a configurable MigrationSpec: plans the change, writes it as a search/replace diff, validates it, verifies it for real in an E2B sandbox, and opens a PR once a human approves."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "e2b>=2.30.0",
    "fastembed>=0.8.0",
    "gitpython>=3.1.50",
    "langchain-anthropic>=1.4.8",
    "langchain-openai>=1.3.3",
    "langgraph>=1.2.7",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pygithub>=2.9.1",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.18.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repograte"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
